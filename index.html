const TPL_COL = {
  // 各项需求跟踪 → 0-indexed 列号（08-28 重排的39列版，与 Python 解析器 COL_MAP 一一对应）
  tasks: { month:1, demandItem:2, settleType:3, name:4, source:5, matQty:7, dueMonth:11,
           timelyRate:13, totalPoints:14, itemCount:15, reviewIssues:16,
           accuracyRate:19, collectedTime:21, collected:23, completionRate:27,
           invalidData:28, invalidRate:29, publishedData:30, closed:34 },
  // 预算与结算 → 0-indexed（新版：row4 起数据；25年对比3列 col7-9）
  settlements: { month:0, module:1, type:2, qty:3, price:4, cost:5,
                 lastQty:6, lastPrice:7, lastCost:8 },
  // 加工预审 → 0-indexed（价格审核结果col9、不通过原因col10）
  preReview: { reviewer:2, month:1, isNew:6, passed:7, priceAudit:8, reason:9 },
  // 采集产能 → 0-indexed（新版9列：含计划/实际需求量）
  capacity: { month:0, planQty:1, planHouse:2, planItem:3, actQty:4, actHouse:5, actItem:6, staff:7, note:8 }
};

function cellNum(v){ if(v==null||v==='') return null; const n=parseFloat(v); return isNaN(n)?null:n; }

function fmtDueMonth(v){
  if(v==null) return null;
  const s = String(v).trim();
  let m = s.match(/(\d{1,2})\s*月/);                  // "7月" / "2026年7月"
  if(m) return String(parseInt(m[1])).padStart(2,'0')+'月';
  m = s.match(/(?:-|\.|\/)(\d{1,2})(?:-|\.|\/|$)/);   // "2026-07-31"
  if(m) return String(parseInt(m[1])).padStart(2,'0')+'月';
  if(/^\d{3,4}$/.test(s)){                            // MMDD 无分隔数值（730→07月、1030→10月）
    const n = parseInt(s);
    if(n>=101 && n<=1231){
      const mo = Math.floor(n/100);
      if(mo>=1 && mo<=12) return String(mo).padStart(2,'0')+'月';
    }
  }
  return null;
}

function fmtCollectTime(v){                          // 采集完成时间 → 'YYYY-MM-DD' / 'MM月'
  if(v==null || v==='') return null;
  const s = String(v).trim();
  if(/^\d{3,4}$/.test(s)){                            // MMDD 无分隔（730→07月）
    const n = parseInt(s);
    if(n>=101 && n<=1231){
      const mo = Math.floor(n/100);
      if(mo>=1 && mo<=12) return String(mo).padStart(2,'0')+'月';
    }
  }
  const n = parseFloat(s);                            // Excel 日期序列号（46234→2026-07-31）
  if(/^\d{4,6}$/.test(s) && n>1231){
    const dt = new Date(Math.round((n-25569)*86400*1000));
    if(!isNaN(dt)) return dt.toISOString().slice(0,10);
  }
  const m = s.match(/^\s*(\d{4})[-./](\d{1,2})[-./](\d{1,2})/); // '2026-08-01' 文本
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  return s || null;
}

function parseTasksSheet(aoa){
  const tasks = [], seen = new Set(), col = TPL_COL.tasks;
  for(let r=1; r<aoa.length; r++){ // skip header row (index 0)
    const row = aoa[r]; if(!row) continue;
    const name = row[col.name]; if(!name || String(name).trim()==='') continue;
    const dedup = String(name).trim() + '|' + (row[col.month]||'');
    if(seen.has(dedup)) continue; seen.add(dedup);

    const monthRaw = String(row[col.month]||'').trim();
    let month = '';
    if(monthRaw.includes('月')){
      const n = parseInt(monthRaw.replace('月','').trim());
      month = String(n).padStart(2,'0')+'月';
    }
    // 派生值自算（与 Python 解析器一致，XLSX 读公式无缓存时兜底）
    const itemCnt = cellNum(row[col.itemCount]);
    const matQty = cellNum(row[col.matQty]);
    const review = cellNum(row[col.reviewIssues]);
    const derivedItem = itemCnt!=null ? itemCnt : (matQty!=null && review!=null ? matQty-review : null);
    const totalPts = cellNum(row[col.totalPoints]);
    const derivedTotal = totalPts!=null ? totalPts : (derivedItem!=null ? derivedItem*3 : null);
    const collected = cellNum(row[col.collected]);
    const completed = cellNum(row[col.completionRate]);
    const compRate = completed!=null ? completed*100 : (derivedTotal ? +((collected||0)/derivedTotal*100).toFixed(1) : null);
    const accuracy = cellNum(row[col.accuracyRate]);
    const accRate = accuracy!=null ? accuracy*100 : (matQty ? +(derivedItem/matQty*100).toFixed(1) : null);
    const invRateRaw = cellNum(row[col.invalidRate]);
    const invData = cellNum(row[col.invalidData]);
    const invRate = invRateRaw!=null ? invRateRaw*100 : (collected ? +(invData/collected*100).toFixed(1) : null);
    const timely = row[col.timelyRate];

    tasks.push({
      name: String(name).trim(),
      settleType: String(row[col.settleType]||'').trim(),
      source: String(row[col.source]||'').trim() || null,
      demandItem: String(row[col.demandItem]||'').trim(),
      month,
      dueMonth: fmtDueMonth(row[col.dueMonth]),
      collectedTime: fmtCollectTime(row[col.collectedTime]),
      totalPoints: derivedTotal!=null ? Math.round(derivedTotal) : null,
      itemCount: derivedItem!=null ? Math.round(derivedItem) : null,
      matQty: matQty!=null ? Math.round(matQty) : null,
      reviewIssues: review!=null ? Math.round(review) : 0,
      issuedQty: derivedTotal!=null ? Math.round(derivedTotal) : null,
      collected: collected!=null ? Math.round(collected) : null,
      completionRate: compRate!=null ? +compRate.toFixed(1) : null,
      accuracyRate: accRate!=null ? +accRate.toFixed(1) : null,
      invalidData: invData!=null ? Math.round(invData) : null,
      invalidRate: invRate!=null ? +invRate.toFixed(1) : null,
      publishedData: cellNum(row[col.publishedData])!=null ? Math.round(cellNum(row[col.publishedData])) : null,
      timelyRate: timely!=null ? (cellNum(timely)===1?1:0) : null,
      feedbackMat: null, expertVerify: null, supplierRejects: null,
      closed: String(row[col.closed]||'').trim()||null, allClosed: null, notes: null,
    });
  }
  return tasks;
}

function parseSettlementsSheet(aoa){
  const settlements = [], col = TPL_COL.settlements;
  for(let r=3; r<aoa.length; r++){ // skip rows 0(title),1(分组表头),2(子表头),3→data
    const row = aoa[r]; if(!row) continue;
    const month=row[col.month], module=row[col.module], type=row[col.type];
    if(!month || !module || !type) continue;
    const qty = cellNum(row[col.qty])||0, price = cellNum(row[col.price])||0;
    const costRaw = cellNum(row[col.cost]);
    const lQty = cellNum(row[col.lastQty]), lPrice = cellNum(row[col.lastPrice]);
    settlements.push({
      "月份":String(month).trim(), "产品模块":String(module).trim(),
      "需求类型":String(type).trim(), "需求数量":Math.round(qty),
      "结算单价":price,
      // 结算金额 = 需求数量 × 结算单价（公式列无缓存时自算）
      "结算金额":costRaw!=null ? costRaw : +(qty*price).toFixed(2),
      "去年需求数量":lQty!=null ? Math.round(lQty) : null,
      "去年结算单价":lPrice!=null ? +lPrice.toFixed(2) : null,
      "去年支出费用":(lQty!=null && lPrice!=null) ? +(lQty*lPrice).toFixed(2) : null,
    });
  }
  return settlements;
}

function parseQualitySheet(aoa){
  const qr = {}; let cur = null, curMonth = null;
  for(let r=1; r<aoa.length; r++){
    const row = aoa[r]; if(!row) continue;
    const a=row[0], b=row[1], d=row[3], e=row[4];
    if(a && b && String(a).trim() !== '月份') {
      cur = String(b).trim();
      curMonth = String(a).trim();
      if(!qr[cur]) qr[cur] = {by_month:{}};
      if(!qr[cur].by_month[curMonth]) qr[cur].by_month[curMonth] = {};
    }
    if(cur && curMonth && d!=null && e!=null) {
      qr[cur].by_month[curMonth][String(d).trim()] = e;
    }
  }
  return qr;
}

function parseProductAcceptanceSheet(aoa){
  const pa = {by_month:{}};
  for(let r=1; r<aoa.length; r++){
    const row = aoa[r]; if(!row) continue;
    const month = row[0], label = row[1], val = row[2];
    if(!month || String(month).trim() === '月份' || String(month).trim() === '') continue;
    const mm = String(month).trim();
    if(!pa.by_month[mm]) pa.by_month[mm] = {};
    if(label && val != null) pa.by_month[mm][String(label).trim()] = parseFloat(val)||val;
  }
  return Object.keys(pa.by_month).length ? pa : null;
}

function parsePreReviewSheet(aoa){
  const stats = {total:0, passed:0, failed:0, by_reviewer:{}, by_month:{}, fail_reasons:{},
                 new_enterprise:0, old_enterprise:0, price_audit:{total:0, passed:0}};
  let has = false;
  const col = TPL_COL.preReview;
  for(let r=2; r<aoa.length; r++){ // skip header row (index 1), start from data
    const row = aoa[r]; if(!row) continue;
    const reviewer=row[col.reviewer], passed=String(row[col.passed]||'').trim(),
          month=row[col.month], reason=row[col.reason], isNew=row[col.isNew],
          priceAudit=String(row[col.priceAudit]||'').trim();
    if(!reviewer) continue;
    has = true; stats.total++;
    const ok = passed === '是';
    if(ok) stats.passed++; else stats.failed++;
    const rn = String(reviewer).trim();
    stats.by_reviewer[rn] = stats.by_reviewer[rn] || {total:0, passed:0, passRate:0};
    stats.by_reviewer[rn].total++;
    if(ok) stats.by_reviewer[rn].passed++;
    const m = String(month||'').trim();
    if(m){
      stats.by_month[m] = stats.by_month[m] || {total:0, passed:0, passRate:0};
      stats.by_month[m].total++;
      if(ok) stats.by_month[m].passed++;
    }
    if(reason && !ok){ const rs=String(reason).trim(); if(rs) stats.fail_reasons[rs] = (stats.fail_reasons[rs]||0)+1; }
    // 新老供应商占比
    if(isNew && (String(isNew).trim()==='是'||String(isNew).trim()==='新增')) stats.new_enterprise++;
    else if(isNew && String(isNew).trim()==='更新登记表') stats.old_enterprise++;
    // 价格审核通过率（col9）
    if(priceAudit==='是' || priceAudit==='通过'){ stats.price_audit.total++; stats.price_audit.passed++; }
    else if(priceAudit==='否' || priceAudit==='不通过'){ stats.price_audit.total++; }
  }
  if(!has) return null;
  stats.passRate = stats.total ? +(stats.passed/stats.total*100).toFixed(1) : 0;
  stats.price_audit.passRate = stats.price_audit.total ? +(stats.price_audit.passed/stats.price_audit.total*100).toFixed(1) : 0;
  Object.values(stats.by_reviewer).forEach(v => { v.passRate = v.total ? +(v.passed/v.total*100).toFixed(1) : 0; });
  Object.values(stats.by_month).forEach(v => { v.passRate = v.total ? +(v.passed/v.total*100).toFixed(1) : 0; });
  return stats;
}

function parseFeedbackSheet(aoa){
  const fb = {}, labels = {}; let section = 'main';
  for(let r=1; r<aoa.length; r++){
    const row = aoa[r]; if(!row) continue;
    const label = String(row[0]||'').trim();
    if(!label || label === '数量') continue;
    if(label === '已共识问题标签'){ section='labels'; continue; }
    const val = row[1];
    if(section === 'main') fb[label] = parseInt(val)||val;
    else labels[label] = parseInt(val)||val;
  }
  if(Object.keys(labels).length) fb['已共识问题标签'] = labels;
  return Object.keys(fb).length ? fb : null;
}

function parseCollectionCapacitySheet(aoa){
  const items = [], col = TPL_COL.capacity;
  for(let r=1; r<aoa.length; r++){
    const row = aoa[r]; if(!row) continue;
    const month = row[col.month];
    if(!month) continue;
    items.push({
      "月份": String(month).trim(),
      "计划需求量": cellNum(row[col.planQty]),
      "计划采集家数": cellNum(row[col.planHouse]),
      "计划采集条数": cellNum(row[col.planItem]),
      "实际需求量": cellNum(row[col.actQty]),
      "实际采集家数": cellNum(row[col.actHouse]),
      "实际采集条数": cellNum(row[col.actItem]),
      "员工总人数": cellNum(row[col.staff]),
      "备注": row[col.note]!=null ? String(row[col.note]).trim() : null,
    });
  }
  return items;
}

function computeMonthlyTrend(tasks){
  const trend = {}, months = [...new Set(tasks.map(t=>t.month).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b));
  trend['需求总条数']=[]; trend['采集下发数']=[]; trend['采集完成数']=[];
  trend['采集完成率']=[]; trend['需求准确率']=[]; trend['无效数据数']=[]; trend['无效数据率']=[];
  months.forEach(m => {
    const mt = tasks.filter(t=>t.month===m);
    const tp = mt.reduce((s,t)=>s+num(t.totalPoints),0);
    const ti = mt.reduce((s,t)=>s+num(t.issuedQty),0);
    const tc = mt.reduce((s,t)=>s+num(t.collected),0);
    const tr = mt.reduce((s,t)=>s+num(t.reviewIssues),0);
    const ti2 = mt.reduce((s,t)=>s+num(t.invalidData),0);
    trend['需求总条数'].push(tp);
    trend['采集下发数'].push(ti);
    trend['采集完成数'].push(tc);
    trend['采集完成率'].push(ti ? +(tc/ti*100).toFixed(1) : 0);
    trend['需求准确率'].push(tp ? +((1-tr/tp)*100).toFixed(1) : 0);
    trend['无效数据数'].push(ti2);
    trend['无效数据率'].push(tc ? +(ti2/tc*100).toFixed(1) : 0);
  });
  return trend;
}

function autoImportTemplate(wb){
  // 解析全部Sheet
  const tasks = parseTasksSheet(XLSX.utils.sheet_to_json(wb.Sheets['各项需求跟踪'], {header:1, defval:null}));
  const settlements = parseSettlementsSheet(XLSX.utils.sheet_to_json(wb.Sheets['预算与结算'], {header:1, defval:null}));
  const qualityReview = parseQualitySheet(XLSX.utils.sheet_to_json(wb.Sheets['质量抽审'], {header:1, defval:null}));
  const preReview = parsePreReviewSheet(XLSX.utils.sheet_to_json(wb.Sheets['加工预审'], {header:1, defval:null}));
  const issueFeedback = parseFeedbackSheet(XLSX.utils.sheet_to_json(wb.Sheets['问题反馈'], {header:1, defval:null}));
  const productAcc = wb.Sheets['产品验收'] ? parseProductAcceptanceSheet(XLSX.utils.sheet_to_json(wb.Sheets['产品验收'], {header:1, defval:null})) : null;
  const capacity = wb.Sheets['采集产能'] ? parseCollectionCapacitySheet(XLSX.utils.sheet_to_json(wb.Sheets['采集产能'], {header:1, defval:null})) : [];
  const monthlyTrend = computeMonthlyTrend(tasks);

  // 更新 DATA
  DATA.tasks = tasks;
  if(settlements.length) DATA.settlements = settlements;
  if(Object.keys(qualityReview).length) DATA.qualityReview = qualityReview;
  if(preReview) DATA.preReview = preReview;
  if(issueFeedback && issueFeedback.问题反馈量) DATA.issueFeedback = issueFeedback;
  if(productAcc) DATA.productAcceptance = productAcc;
  if(capacity.length) DATA.collectionCapacity = capacity;
  DATA.monthlyTrend = monthlyTrend;
  // 更新 filterOptions (收集唯一值)
  const di = [...new Set(tasks.map(t=>t.demandItem).filter(Boolean))].sort();
  const st = [...new Set(tasks.map(t=>t.settleType).filter(Boolean))].sort();
  const sr = [...new Set(tasks.map(t=>t.source).filter(Boolean))].sort();
  const mo = [...new Set(tasks.map(t=>t.month).filter(Boolean))].sort();
  DATA.filterOptions = DATA.filterOptions || {};
  DATA.filterOptions.demandItems = ['全部', ...di];
  DATA.filterOptions.settleTypes = ['全部', ...st];
  DATA.filterOptions.sources = ['全部', ...sr];
  DATA.filterOptions.months = ['全部', ...mo];
  // 更新月份和月名
  DATA.months = mo;
  DATA.monthNames = {};
  mo.forEach(m => { const k = m.replace('月','').padStart(2,'0'); DATA.monthNames[k] = m; });

  localStorage.setItem('kdata_v3', JSON.stringify(DATA));
  renderAll();
  return tasks.length + settlements.length;
}

function showCSV(m,t){const el=document.getElementById("csvMsg");el.textContent=m;el.className="status-msg "+(t==="ok"?"ok":t==="err"?"err":"info");}
function handleFile(file){
  const isE=file.name.endsWith(".xlsx")||file.name.endsWith(".xls");const isC=file.name.endsWith(".csv");
  if(!isE&&!isC){showCSV("请选择 CSV/Excel","err");return;}
  const r=new FileReader();isE?r.readAsArrayBuffer(file):r.readAsText(file);
  r.onload=e=>{
    // 检测模板文件（含多项需求跟踪/预算与结算Sheet）
    if(isE){
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
        const sn=wb.SheetNames;
        if(sn.includes('各项需求跟踪') && sn.includes('预算与结算')){
          showCSV(`📋 检测到模板文件(${sn.length}个Sheet)，自动解析中...`,"ok");
          const total = autoImportTemplate(wb);
          showCSV(`🎉 导入完成: ${total} 条任务/结算/预审/抽审/反馈`,"ok");
          setTimeout(()=>{ closeCSV(); toast("模板全Sheet导入成功!","success"); },600);
          return;
        }
      }catch(ex){ showCSV("解析失败:"+ex.message,"err"); return; }
    }
    // 非模板 → 原有导入流程
    let result;
    if(isE){try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const j=XLSX.utils.sheet_to_json(ws,{defval:""});result={data:j,meta:{fields:j.length?Object.keys(j[0]):[]}};if(!j.length){showCSV("Excel为空","err");return}showCSV(`✅ ${j.length}行`,"ok")}catch(ex){showCSV("解析失败:"+ex.message,"err");return}}else{result=Papa.parse(e.target.result,{header:true,skipEmptyLines:true});showCSV(`✅ ${result.data.length}行`,"ok")}
    const headers=result.meta.fields||[];
    const prev=document.getElementById("csvPreview");
    prev.innerHTML="<table><thead><tr>"+headers.map(h=>`<th>${h}</th>`).join("")+"</tr></thead><tbody>"+result.data.slice(0,4).map(r=>"<tr>"+headers.map(h=>`<td>${r[h]||""}</td>`).join("")+"</tr>").join("")+"</tbody></table>";
    document.getElementById("csvPreviewArea").classList.remove("hidden");
    const mapFields={
      month:"月份", demandItem:"需求项", demandType:"结算类型", project:"需求名称", source:"需求来源",
      totalPoints:"下发数量", itemCount:"材料数量", reviewIssues:"预审问题数据",
      reviewFeedbackRate:"需求反馈率",
      issuedQty:"下发数量", collectedQty:"实际采集完成量",
      completionRate:"采集完成率", accuracy:"需求准确率",
      invalidData:"无效数据", invalidRate:"无效数据占比", publishedData:"发布数据", timelyRate:"发布及时率",
    };
    document.getElementById("csvMapping").innerHTML=Object.entries(mapFields).map(([k,l])=>{
      const m=detectField(headers,k);return `<div class="csv-mapping-item"><label>${l}</label><select id="cm_${k}">${["",...headers].map(h=>`<option value="${h}" ${h===m?"selected":""}>${h||"—不导入—"}</option>`).join("")}</select></div>`;
    }).join("");
    document.getElementById("csvMappingArea").classList.remove("hidden");
    document.getElementById("csvApplyBtn").disabled=false;
    window._csvResult=result;
  };
}
function applyCSV(){
  const result=window._csvResult;if(!result)return;
  const map={};document.querySelectorAll("#csvMapping select").forEach(s=>{if(s.value)map[s.id.replace("cm_","")]=s.value});
  try{
    const tasks = result.data.map(row => {
      function v(k){ const col=map[k]; return col ? row[col] : undefined; }
      // 月份格式化: "3月" → "03月"
      let monthRaw = (v('month') || '').toString().trim();
      let month = '';
      if(monthRaw.includes('月')){
        const num = parseInt(monthRaw.replace('月','').trim());
        month = String(num).padStart(2,'0')+'月';
      } else if(monthRaw){
        month = String(parseInt(monthRaw)).padStart(2,'0')+'月';
      }
      const totalPts = parseFloat(v('totalPoints'));
      const hasTotal = v('totalPoints') !== undefined && v('totalPoints') !== '';
      return {
        name: (v('project') || '').toString().trim(),
        settleType: (v('demandType') || '').toString().trim(),
        source: (v('source') || '').toString().trim() || null,
        demandItem: (v('demandItem') || '').toString().trim(),
        month: month,
        totalPoints: hasTotal && !isNaN(totalPts) ? totalPts : null,
        itemCount: (v('itemCount')!==undefined && v('itemCount')!=='') ? parseFloat(v('itemCount')) : null,
        reviewIssues: (v('reviewIssues')!==undefined && v('reviewIssues')!=='') ? parseFloat(v('reviewIssues')) : 0,
        reviewFeedbackRate: (v('reviewFeedbackRate')!==undefined && v('reviewFeedbackRate')!=='') ? parseFloat(v('reviewFeedbackRate')) : null,
        issuedQty: hasTotal && !isNaN(totalPts) ? totalPts : null,
        collected: (v('collectedQty')!==undefined && v('collectedQty')!=='') ? parseFloat(v('collectedQty')) : null,
        completionRate: (v('completionRate')!==undefined && v('completionRate')!=='') ? parseFloat(v('completionRate')) : null,
        accuracyRate: (v('accuracy')!==undefined && v('accuracy')!=='') ? parseFloat(v('accuracy')) : null,
        invalidData: (v('invalidData')!==undefined && v('invalidData')!=='') ? parseFloat(v('invalidData')) : null,
        invalidRate: (v('invalidRate')!==undefined && v('invalidRate')!=='') ? parseFloat(v('invalidRate')) : null,
        publishedData: (v('publishedData')!==undefined && v('publishedData')!=='') ? parseFloat(v('publishedData')) : null,
        timelyRate: (v('timelyRate')!==undefined && v('timelyRate')!=='') ? parseFloat(v('timelyRate')) : null,
        feedbackMat: null, expertVerify: null, supplierRejects: null,
        closed: null, allClosed: null, notes: null,
      };
    }).filter(t => t.name);

    if(!tasks.length){ showCSV("没有有效数据行","err"); return; }
    DATA.tasks = tasks;
    // 非模板导入也更新 filterOptions
    const di = [...new Set(tasks.map(t=>t.demandItem).filter(Boolean))].sort();
    const st = [...new Set(tasks.map(t=>t.settleType).filter(Boolean))].sort();
    const sr = [...new Set(tasks.map(t=>t.source).filter(Boolean))].sort();
    const mo = [...new Set(tasks.map(t=>t.month).filter(Boolean))].sort();
    DATA.filterOptions = DATA.filterOptions || {};
    DATA.filterOptions.demandItems = ['全部', ...di];
    DATA.filterOptions.settleTypes = ['全部', ...st];
    DATA.filterOptions.sources = ['全部', ...sr];
    DATA.filterOptions.months = ['全部', ...mo];
    localStorage.setItem("kdata_v3",JSON.stringify(DATA));
    renderAll();
    showCSV(`🎉 成功导入 ${tasks.length} 条任务`,"ok");
    setTimeout(()=>{ closeCSV(); toast(`已导入 ${tasks.length} 条任务`,"success"); },800);
  }catch(ex){ showCSV("导入出错: "+ex.message,"err"); }
}
function openCSV(){document.getElementById("csvPanel").classList.add("show");document.getElementById("csvOv").classList.add("show");}
function closeCSV(){document.getElementById("csvPanel").classList.remove("show");document.getElementById("csvOv").classList.remove("show");document.getElementById("csvPreviewArea").classList.add("hidden");document.getElementById("csvMappingArea").classList.add("hidden");document.getElementById("csvApplyBtn").disabled=true;document.getElementById("csvInput").value="";}
